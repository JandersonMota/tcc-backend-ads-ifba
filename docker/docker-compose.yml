# Ambiente local do Juridora (desenvolvimento).
#   Só o banco:     docker compose -f docker/docker-compose.yml up -d
#                   (a API roda fora do Docker: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local)
#   Banco + API:    docker compose -f docker/docker-compose.yml --profile api up -d --build
#   Parar:          docker compose -f docker/docker-compose.yml --profile api down
#   Zerar:          docker compose -f docker/docker-compose.yml --profile api down -v   (apaga os dados)
#
# Senhas, portas e chaves JWT: docker/.env (não versionado, está no .gitignore).
# Os scripts de docker/postgres só rodam na PRIMEIRA criação do volume.

name: juridora

services:
  juridora-postgres:
    image: postgres:18.7            # mesma série usada nos testes (Testcontainers)
    container_name: juridora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juridora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}               # superusuário: só administração
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_OWNER_SENHA: ${APP_OWNER_SENHA:-app_owner}          # dono das tabelas (Flyway)
      APP_USER_SENHA: ${APP_USER_SENHA:-app_user}             # usado pela aplicação (sem BYPASSRLS)
      TZ: America/Bahia
    ports:
      - "${POSTGRES_PORTA:-5432}:5432"
    volumes:
      # PostgreSQL 18+: o volume é montado em /var/lib/postgresql (PGDATA fica em 18/docker)
      - juridora-postgres-dados:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  juridora-api:
    profiles: ["api"]               # só sobe com --profile api (evita conflito com o ./mvnw na 8080)
    build:
      context: ..                   # raiz do repositório, onde está o Dockerfile
    image: juridora-api:local
    container_name: juridora-api
    restart: unless-stopped
    depends_on:
      juridora-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # O perfil local aponta para localhost; dentro da rede do compose o banco é o serviço juridora-postgres.
      SPRING_DATASOURCE_URL: jdbc:postgresql://juridora-postgres:5432/${POSTGRES_DB:-juridora}
      APP_OWNER_SENHA: ${APP_OWNER_SENHA:-app_owner}          # Flyway como app_owner
      APP_USER_SENHA: ${APP_USER_SENHA:-app_user}             # aplicação como app_user (RLS aplicado)
      # Vazias: par de chaves temporário a cada inicialização (tokens não sobrevivem a reinícios).
      JWT_CHAVE_PRIVADA: ${JWT_CHAVE_PRIVADA:-}
      JWT_CHAVE_PUBLICA: ${JWT_CHAVE_PUBLICA:-}
      TZ: America/Bahia
    ports:
      - "${API_PORTA:-8080}:8080"
    healthcheck:
      # A imagem JRE não tem curl/wget: consulta o /actuator/health pelo /dev/tcp do bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

volumes:
  juridora-postgres-dados:
    name: juridora-postgres-dados
