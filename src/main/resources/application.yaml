spring:
  application:
    name: juridora-api

  jpa:
    # O schema é criado somente pelo Flyway (incluindo RLS); o Hibernate apenas valida.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Página em JSON estável ({content, page}) e tamanho máximo por requisição.
        serialization-mode: via-dto
        max-page-size: 100

  modulith:
    events:
      # Registro de publicação de eventos (spring-modulith-starter-jpa).
      # As tabelas event_publication* são criadas pelo Flyway (V1).
      republish-outstanding-events-on-restart: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

juridora:
  seguranca:
    # JWT emitido pela própria aplicação (ADR-014), assinado com RS256.
    jwt:
      emissor: juridora
      validade: 15m
      # Chaves em PEM (privada PKCS#8, pública X.509). Vazias: par temporário gerado na
      # inicialização (perfil local e testes); em produção, defina as duas variáveis.
      chave-privada: ${JWT_CHAVE_PRIVADA:}
      chave-publica: ${JWT_CHAVE_PUBLICA:}
    # Bloqueio temporário do login (HU06, RNF04).
    login:
      maximo-falhas: 5
      janela: 15m
      bloqueio: 15m
    # Limpeza das revogações de tokens já expirados (HU07).
    logout:
      intervalo-limpeza: 1h
  # Limites por plano (RN09). Ao atingir um limite, só a criação é bloqueada.
  planos:
    free:
      usuarios-ativos: 2
      clientes-ativos: 50
      processos-ativos: 50
