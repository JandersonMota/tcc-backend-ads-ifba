# HU04 – Integração contínua: executa `mvn verify` a cada push e pull request.
# Inclui testes unitários, integração com Testcontainers (PostgreSQL 18) e
# verificação de módulos (ApplicationModules.verify()).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e testes (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar documentação dos módulos (Spring Modulith)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: documentacao-modulos
          path: target/spring-modulith-docs/
          if-no-files-found: ignore
          retention-days: 14
