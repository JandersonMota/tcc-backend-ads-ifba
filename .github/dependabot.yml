# HU04 – Dependabot: atualização e alerta de vulnerabilidades.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Mantém o PostgreSQL na série 18 (atualizações de versão maior são decisão do projeto)
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
